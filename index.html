<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBOT V5.1 AUTO SMC A à Z</title>
<style>
body{background:#0f1115;color:#fff;font-family:Arial,sans-serif;padding:15px;margin:0}
h1{font-size:20px} h1 span{color:#22ff88}
.card{background:#1a1d24;border-radius:15px;padding:15px;margin-bottom:15px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0f1115;color:#fff;font-size:16px;box-sizing:border-box}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#22ff88;color:#000;font-weight:900;font-size:17px;cursor:pointer}
button:disabled{background:#555;color:#ccc}
img{width:100%;border-radius:10px;margin-top:10px;display:none}
.result{background:#0a2a1a;border:1px solid #22ff88;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.5;display:none}
.error{background:#3a0a0a;border:1px solid #ff4444;border-radius:12px;padding:12px;color:#ffb3b3;display:none;font-size:13px}
small{color:#888}
label{font-weight:bold;display:block;margin-bottom:6px;margin-top:12px}
</style>
</head>
<body>
<h1>ROBOT V5.1 <span>AUTO SMC A à Z</span></h1>
<p><small>Upload = Analyse IA automatique. Plus de cases à cocher à la main.</small></p>

<div class="card">
<label>1. Ta clé IA gratuite (1 seule fois)</label>
<input id="apiKey" type="password" placeholder="Colle ta clé ici - commence par AIza ou AQ.">
<p><small>Va sur aistudio.google.com > Get API Key > Gratuit. Sans ça, le robot ne peut pas VOIR.</small></p>

<label>Paire</label>
<select id="paire">
<option>Volatility 50 (1s)</option>
<option>Volatility 75 (1s)</option>
<option>Volatility 100 (1s)</option>
<option>Volatility 50 Index</option>
<option>Volatility 75 Index</option>
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>XAU/USD - GOLD</option>
</select>

<label>Prix actuel sur la capture</label>
<input id="prix" type="number" placeholder="Ex: 199568.28" value="199568.28">

<label>Capture TradingView / 1xBet</label>
<input id="file" type="file" accept="image/*">
<img id="preview">
</div>

<button id="btn" onclick="analyser()">🤖 ANALYSER AUTO SMC A à Z</button>
<p style="text-align:center"><small>🧠 L'IA analyse Sweep, BOS, CHOCH, OB, FVG, OTE... 10 sec...</small></p>

<div id="err" class="error"></div>
<div id="res" class="result"></div>

<script>
let base64Img = "";
document.getElementById('file').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = function(ev){
    base64Img = ev.target.result.split(',')[1];
    const p = document.getElementById('preview');
    p.src = ev.target.result; p.style.display='block';
  };
  r.readAsDataURL(f);
});

async function analyser(){
  const key = document.getElementById('apiKey').value.trim();
  const paire = document.getElementById('paire').value;
  const prix = document.getElementById('prix').value;
  const errDiv = document.getElementById('err');
  const resDiv = document.getElementById('res');
  const btn = document.getElementById('btn');
  errDiv.style.display='none'; resDiv.style.display='none';

  if(!key){ alert("Colle d'abord ta clé IA !"); return; }
  if(!base64Img){ alert("Upload d'abord ta capture !"); return; }

  btn.disabled=true; btn.innerText="⏳ L'IA analyse... attends 10 sec...";

  const prompt = `Tu es un expert SMC trader sur ${paire}. Prix actuel: ${prix}.
Analyse ce graphique en détail et réponds UNIQUEMENT en français, de façon claire et structurée :

1. STRUCTURE : Tendance H1 / M15 ? BOS ou CHOCH visible ? Où ?
2. SWEEP : Y a-t-il eu un sweep de liquidité (mèche qui prend un haut/bas) ?
3. ORDER BLOCK : Où est le dernier OB valide ? Donne zone prix.
4. FVG : Y a-t-il un Fair Value Gap à combler ?
5. OTE : Zone OTE 62-79% Fibonacci ?
6. PLAN : 
- Direction : BUY ou SELL ou ATTENDRE ?
- Entrée : prix exact
- Stop Loss : prix exact
- Take Profit 1 / TP2 : prix exact
- Raison en 1 phrase.

Si le graphique est flou, dis-le. Ne invente pas de prix si tu ne vois pas. Sois précis.`;

  // MODELES A TESTER DANS L'ORDRE - si le 1er échoue, on essaie le 2e
  const modeles = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-2.0-flash-lite"];
  let derniereErreur = "";

  for(let modele of modeles){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modele}:generateContent?key=${key}`;
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contents: [{ parts: [{text: prompt}, {inline_data: {mime_type: "image/jpeg", data: base64Img}}] }]
        })
      });
      const data = await response.json();

      // SI GOOGLE RENVOIE UNE ERREUR, ON L'AFFICHE VRAIMENT
      if(data.error){
        derniereErreur = "Modèle " + modele + " -> " + data.error.message + " (Code: " + data.error.code + ")";
        console.log(derniereErreur);
        continue; // essaie le modèle suivant
      }

      if(!data.candidates || !data.candidates[0] || !data.candidates[0].content){
        derniereErreur = "Google a répondu mais sans résultat. Essaie une autre capture plus nette.";
        continue;
      }

      const texte = data.candidates[0].content.parts[0].text;
      resDiv.innerText = "✅ ANALYSE " + paire + " - Modèle: " + modele + "\n\n" + texte;
      resDiv.style.display='block';
      btn.disabled=false; btn.innerText="🤖 ANALYSER AUTO SMC A à Z";
      return;

    } catch(e){
      derniereErreur = "Erreur connexion: " + e.message;
    }
  }

  // SI LES 3 MODELES ONT ECHOUE, ON AFFICHE LA VRAIE RAISON
  errDiv.innerHTML = "<b>❌ L'IA a bloqué. Voici la VRAIE raison de Google :</b><br><br>" + derniereErreur + "<br><br><b>Que faire ?</b><br>1. Vérifie que ta clé est bien collée sans espace devant/derrière<br>2. Va sur aistudio.google.com > Crée une NOUVELLE clé dans un NOUVEAU projet<br>3. Attends 2 min et réessaie";
  errDiv.style.display='block';
  btn.disabled=false; btn.innerText="🤖 ANALYSER AUTO SMC A à Z";
}
</script>
</body>
</html>
